<ion-content class="page">

  <!-- HEADER -->
  <div class="header app-page-header">
    <ion-icon name="arrow-back-outline" (click)="close()"></ion-icon>
    <span class="app-page-title">Review Enhanced Caption</span>
  </div>

  <div class="container">

    <!-- ORIGINAL -->
    <div class="card">
      <label>Original Caption</label>
      <ion-textarea [value]="post.content" readonly></ion-textarea>
    </div>

    <!-- ENHANCED -->
    <div class="card">
      <label>Enhanced Caption</label>
      <ion-textarea [(ngModel)]="post.content"></ion-textarea>
    </div>

    <!-- COMMENTS -->
    <div class="card">
      <label>PAIR Staff Comments</label>
      <ion-textarea [(ngModel)]="feedback"></ion-textarea>
    </div>

    <!-- DECISION -->
    <div class="card">
      <label>Your Decision</label>

      <div class="option" [class.active]="decision==='approve'" (click)="decision='approve'">
        <div class="radio"></div>
        <div>
          <strong>Approve</strong>
          <p>Caption is good. Ready to post.</p>
        </div>
      </div>

      <div class="option" [class.active]="decision==='reject'" (click)="decision='reject'">
        <div class="radio"></div>
        <div>
          <strong>Request Revisions</strong>
          <p>Send back to PAIR with feedback.</p>
        </div>
      </div>

      <div *ngIf="decision==='reject'" class="feedback">
        <label>What needs improvement?</label>
        <ion-textarea [(ngModel)]="feedback"></ion-textarea>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <ion-button fill="outline" (click)="close()">Cancel</ion-button>
      <ion-button color="success" (click)="submit()">
        Approve & Update
      </ion-button>
    </div>

  </div>

</ion-content>
