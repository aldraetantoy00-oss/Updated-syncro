<ion-content [fullscreen]="true">

  <div class="page">

    <!-- HEADER -->
    <div class="header">
      <div class="top">
        <ion-button fill="clear" color="light" (click)="goBack()">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </ion-button>
        <h1>Change Password</h1>
        <div style="width: 40px;"></div>
      </div>
      <p>Update your password to keep your account secure</p>
    </div>

    <!-- FORM -->
    <div class="form-container">

      <!-- CURRENT PASSWORD -->
      <div class="form-group">
        <label>Current Password</label>
        <div class="password-input-group">
          <ion-input
            [(ngModel)]="currentPassword"
            [type]="showCurrentPassword ? 'text' : 'password'"
            placeholder="Enter current password"
            class="password-input"
          ></ion-input>
          <ion-button fill="clear" (click)="togglePasswordVisibility('current')" class="eye-button">
            <ion-icon [name]="showCurrentPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>
      </div>

      <!-- NEW PASSWORD -->
      <div class="form-group">
        <label>New Password</label>
        <div class="password-input-group">
          <ion-input
            [(ngModel)]="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            placeholder="Enter new password (min 6 characters)"
            class="password-input"
          ></ion-input>
          <ion-button fill="clear" (click)="togglePasswordVisibility('new')" class="eye-button">
            <ion-icon [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>
        <small class="hint">At least 6 characters</small>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="password-input-group">
          <ion-input
            [(ngModel)]="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm new password"
            class="password-input"
          ></ion-input>
          <ion-button fill="clear" (click)="togglePasswordVisibility('confirm')" class="eye-button">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>
      </div>

    </div>

    <!-- BUTTONS -->
    <div class="button-group">
      <ion-button
        expand="block"
        color="primary"
        (click)="changePassword()"
        [disabled]="isSubmitting"
        class="submit-btn"
      >
        <ion-icon name="checkmark-outline" slot="start"></ion-icon>
        {{ isSubmitting ? 'Updating...' : 'Update Password' }}
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        color="medium"
        (click)="goBack()"
        [disabled]="isSubmitting"
      >
        <ion-icon name="close-outline" slot="start"></ion-icon>
        Cancel
      </ion-button>
    </div>

  </div>

</ion-content>
