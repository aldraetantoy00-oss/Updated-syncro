<ion-content class="password-content">
  <div class="password-page">
    <nav class="mobile-app-bar app-page-header app-topbar" aria-label="Main navigation">
      <ion-menu-button aria-label="Open menu">
        <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
      </ion-menu-button>
      <span class="mobile-brand syncro-brand" aria-label="Syncro">
        <ion-icon name="sync-outline" aria-hidden="true"></ion-icon>
        <span>Syncro</span>
      </span>
      <ion-button fill="clear" color="light" [routerLink]="notificationsUrl" aria-label="Notifications">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </nav>

    <header class="page-heading app-page-heading">
      <ion-button fill="clear" color="dark" [routerLink]="backUrl" aria-label="Back to dashboard">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <div>
        <h1>Change password</h1>
        <p>Update your password to keep your account secure</p>
      </div>
    </header>

    <main class="password-layout">
      <section class="password-panel">
        <h2>Sign-in credentials</h2>
        <p class="panel-intro">Enter your current password, then choose a new one.</p>

        <div class="password-fields">
          <div class="field-group">
            <ion-label>Current password</ion-label>
            <div class="password-input-group">
              <ion-input
                [(ngModel)]="currentPassword"
                [type]="showCurrentPassword ? 'text' : 'password'"
                autocomplete="current-password"
                placeholder="Enter current password">
              </ion-input>
              <ion-button fill="clear" (click)="togglePasswordVisibility('current')" [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'">
                <ion-icon [name]="showCurrentPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </div>
          </div>

          <div class="field-group">
            <ion-label>New password</ion-label>
            <div class="password-input-group">
              <ion-input
                [(ngModel)]="newPassword"
                [type]="showNewPassword ? 'text' : 'password'"
                autocomplete="new-password"
                placeholder="Enter a new password">
              </ion-input>
              <ion-button fill="clear" (click)="togglePasswordVisibility('new')" [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'">
                <ion-icon [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </div>
            <small>Use at least 8 characters.</small>
          </div>

          <div class="field-group">
            <ion-label>Confirm new password</ion-label>
            <div class="password-input-group">
              <ion-input
                [(ngModel)]="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                autocomplete="new-password"
                placeholder="Confirm new password">
              </ion-input>
              <ion-button fill="clear" (click)="togglePasswordVisibility('confirm')" [attr.aria-label]="showConfirmPassword ? 'Hide confirmation' : 'Show confirmation'">
                <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <ion-button fill="outline" color="medium" (click)="goBack()" [disabled]="isSubmitting">Cancel</ion-button>
          <ion-button color="success" (click)="changePassword()" [disabled]="isSubmitting">
            <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
            <ion-icon *ngIf="!isSubmitting" name="checkmark-outline" slot="start"></ion-icon>
            {{ isSubmitting ? 'Updating...' : 'Update password' }}
          </ion-button>
        </div>
      </section>
    </main>
  </div>
</ion-content>
