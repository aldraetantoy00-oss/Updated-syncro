<ion-content fullscreen>

  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-form">

      <div class="form-wrapper">

        <!-- LOGO -->
        <h1 class="logo">
          ⟳ Syncro
        </h1>

        <!-- EMAIL -->
        <ion-item
          lines="none"
          class="input-item"
        >

          <ion-icon
            name="person-outline"
            slot="start"
          ></ion-icon>

          <ion-input
            [(ngModel)]="email"
            placeholder="Username"
          ></ion-input>

        </ion-item>

        <!-- PASSWORD -->
        <ion-item
          lines="none"
          class="input-item"
        >

          <ion-icon
            name="lock-closed-outline"
            slot="start"
          ></ion-icon>

          <ion-input
            [(ngModel)]="password"
            type="password"
            placeholder="Password"
          ></ion-input>

        </ion-item>

        <!-- LOGIN BUTTON -->
        <ion-button
          expand="block"
          class="login-btn"
          (click)="login()"
          type="button"
          [disabled]="isLoggingIn"
        >

          {{ isLoggingIn ? 'SIGNING IN...' : 'SIGN IN' }}

        </ion-button>

        <!-- NEW USER -->
        <p class="forgot">

          New to Syncro?

        </p>

        <!-- CREATE ACCOUNT -->
        <div class="create-account-container">

          <span
            class="create-account-link"
            routerLink="/signup"
          >

            CREATE AN ACCOUNT

          </span>

        </div>

      </div>

    </div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="image-side"></div>

  </div>

</ion-content>
