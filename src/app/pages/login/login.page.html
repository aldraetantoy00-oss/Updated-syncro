<ion-content fullscreen>

  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-form">

      <div class="form-wrapper">

        <!-- LOGO -->
        <h1 class="logo syncro-brand" aria-label="Syncro">
          <ion-icon name="sync-outline" aria-hidden="true"></ion-icon>
          <span>Syncro</span>
        </h1>

        <div class="account-request-notice" *ngIf="accountRequestSubmitted" role="status" aria-live="polite">
          Your account request was submitted. You can sign in after an administrator approves it.
        </div>

        <!-- EMAIL -->
        <ion-item
          lines="none"
          class="input-item"
        >

          <ion-icon
            name="person-outline"
            slot="start"
          ></ion-icon>

          <ion-input
            [(ngModel)]="email"
            type="text"
            autocomplete="username"
            placeholder="Username or email"
          ></ion-input>

        </ion-item>

        <!-- PASSWORD -->
        <ion-item
          lines="none"
          class="input-item"
        >

          <ion-icon
            name="lock-closed-outline"
            slot="start"
          ></ion-icon>

          <ion-input
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
          ></ion-input>

          <ion-button
            fill="clear"
            type="button"
            class="password-visibility-toggle"
            slot="end"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="togglePasswordVisibility()"
          >
            <ion-icon
              slot="icon-only"
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              aria-hidden="true"
            ></ion-icon>
          </ion-button>

        </ion-item>

        <!-- LOGIN BUTTON -->
        <ion-button
          expand="block"
          class="login-btn"
          (click)="login()"
          type="button"
          [disabled]="isLoggingIn"
        >

          {{ isLoggingIn ? 'SIGNING IN...' : 'SIGN IN' }}

        </ion-button>

        <!-- NEW USER -->
        <p class="forgot">

          New to Syncro?

        </p>

        <!-- CREATE ACCOUNT -->
        <div class="create-account-container">

          <span
            class="create-account-link"
            routerLink="/signup"
          >

            CREATE AN ACCOUNT

          </span>

        </div>

      </div>

    </div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="image-side"></div>

  </div>

</ion-content>
