<ion-content>

  <div class="page">

    <!-- HEADER -->
<div class="header app-page-header">

  <div class="top-bar app-topbar">

    <ion-menu-button aria-label="Open menu">
      <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
    </ion-menu-button>

    <span class="syncro-brand" aria-label="Syncro">
      <ion-icon name="sync-outline" aria-hidden="true"></ion-icon>
      <span>Syncro</span>
    </span>

    <ion-icon name="notifications-outline"></ion-icon>

  </div>

</div>

    <div *ngIf="loading" class="empty">
      <h2>Loading notifications...</h2>
    </div>

    <div *ngIf="loadError && !loading" class="empty">
      <h2>Could not load notifications</h2>
      <p>{{ loadError }}</p>
      <ion-button (click)="getNotifications()">Try again</ion-button>
    </div>

    <div
      *ngIf="!loading && !loadError && notifications.length === 0"
      class="empty"
    >

      <ion-icon
        name="notifications-off-outline"
      ></ion-icon>

      <h2>No notifications yet</h2>

    </div>

    <!-- NOTIFICATIONS -->
<ng-container *ngIf="!loading && !loadError">
<div
  *ngFor="let item of notifications"
  class="notif-card"
  [class.clickable]="item.parsedData.submission_id"
  (click)="openNotification(item)"
  (keydown.enter)="openNotification(item)"
  [attr.role]="item.parsedData.submission_id ? 'button' : null"
  [attr.tabindex]="item.parsedData.submission_id ? 0 : null"
>

  <!-- ICON -->
  <div class="notif-icon">

    <ion-icon
      name="notifications-outline"
    ></ion-icon>

  </div>

  <!-- CONTENT -->
  <div class="notif-content">

    <!-- TITLE -->
    <h3>

      {{
        item.parsedData.title ||
        'Notification'
      }}

    </h3>

    <!-- MESSAGE -->
    <p>

      {{
        item.parsedData.message ||
        'New activity detected.'
      }}

    </p>

    <!-- DATE -->
    <span>

      {{
        item.created_at
          | date:'MMM d, y • h:mm a'
      }}

    </span>

  </div>
  </div>
  </ng-container>

</div>
