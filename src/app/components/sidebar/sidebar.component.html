<ion-header>
  <ion-toolbar>
    <ion-title>{{ isPair ? 'PAIR Menu' : 'Menu' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="sidebar-top">
    <ion-avatar class="sidebar-avatar" *ngIf="avatarUrl; else noAvatar">
      <img [src]="avatarUrl" alt="avatar" />
    </ion-avatar>
    <ng-template #noAvatar>
      <div class="sidebar-avatar placeholder">{{ (fullName.charAt(0) || 'S').toUpperCase() }}</div>
    </ng-template>

    <div class="sidebar-user">
      <div class="name">{{ fullName }}</div>
      <div class="email">{{ email }}</div>
    </div>
  </div>

  <!-- ORGANIZATION AND DEPARTMENT MENU -->
  <ion-list *ngIf="!isPair">
    <ion-item routerLink="/dashboard" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="home-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-item>

    <ion-item *ngIf="isDepartment" routerLink="/department/organizations" routerLinkActive="selected" menuClose>
      <ion-icon slot="start" name="business-outline"></ion-icon>
      <ion-label>My Organizations</ion-label>
    </ion-item>

    <ion-item routerLink="/submit" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      <ion-label>Submit Content</ion-label>
    </ion-item>

    <ion-item routerLink="/all-submissions" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="pulse-outline"></ion-icon>
      <ion-label>My Submissions</ion-label>
    </ion-item>

    <ion-item routerLink="/notifications" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Notifications</ion-label>
    </ion-item>

    <ion-item routerLink="/tabs/profile" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="person-circle-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-item>
  </ion-list>

  <!-- PAIR MENU -->
  <ion-list *ngIf="isPair">
    <ion-item *ngIf="isAdmin" routerLink="/admin/account-requests" routerLinkActive="selected" menuClose>
      <ion-icon slot="start" name="person-add-outline"></ion-icon>
      <ion-label>Account requests</ion-label>
    </ion-item>

    <ion-item routerLink="/pair-tabs/dashboard" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="home-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-item>

    <ion-item routerLink="/pair-tabs/all-submissions" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="list-outline"></ion-icon>
      <ion-label>PAIR All Submissions</ion-label>
    </ion-item>

    <ion-item routerLink="/pair-tabs/notifications" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Notifications</ion-label>
    </ion-item>

    <ion-item routerLink="/pair-tabs/profile" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" menuClose>
      <ion-icon slot="start" name="person-circle-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-item>
  </ion-list>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" color="light" (click)="logout()" menuClose>Log out</ion-button>
  </ion-toolbar>
</ion-footer>
